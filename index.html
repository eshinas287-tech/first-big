<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three.js Car Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/src/styles.css" rel="stylesheet" />
  </head>
  <body>
    <!-- UI Overlay -->
    <div id="hud">
      <div class="panel">
        <div><strong>Speed:</strong> <span id="speed">0</span> km/h</div>
        <div><strong>Lap:</strong> <span id="lap">0</span></div>
        <div><strong>Distance:</strong> <span id="distance">0</span> m</div>
        <button id="startBtn">Start</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div class="help">Controls: W/A/S/D or Arrow keys. Space: Brake. C: Camera distance.</div>
    </div>

    <!-- Canvas injected by Three.js -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
